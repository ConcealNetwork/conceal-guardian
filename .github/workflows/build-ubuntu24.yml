name: Build Ubuntu 24.04 Executable

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-ubuntu24]
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-ubuntu24:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # Blob and injected binary must be the same Node minor.
      NODE_SEA_VERSION: "22.23.2"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event_name == 'push' && github.ref || github.event.client_payload.branch || 'master' }}

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_SEA_VERSION }}

    - name: Install dependencies
      run: npm ci

    - name: Build SEA binary and package
      run: |
        set -euo pipefail

        rm -rf ./bin/ubuntu24 ./dist ./output ./sea-prep.blob ./sea-config.json
        mkdir -p ./bin/ubuntu24 ./dist ./output

        # Single CJS bundle (SEA-friendly; avoids ESM loader edge cases).
        npx esbuild index.js \
          --bundle \
          --platform=node \
          --format=cjs \
          --outfile=dist/sea.cjs

        printf '%s\n' "{
          \"main\": \"dist/sea.cjs\",
          \"output\": \"sea-prep.blob\",
          \"disableExperimentalSEAWarning\": true
        }" > sea-config.json

        node --experimental-sea-config sea-config.json

        cp "$(command -v node)" ./bin/ubuntu24/guardian-linux64
        npx --yes postject@1.0.0-alpha.6 \
          ./bin/ubuntu24/guardian-linux64 \
          NODE_SEA_BLOB \
          sea-prep.blob \
          --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

        chmod +x ./bin/ubuntu24/guardian-linux64
        ./bin/ubuntu24/guardian-linux64 --version

        cp -R ./html ./bin/ubuntu24/html
        cp ./exclude.txt ./bin/ubuntu24/exclude.txt
        cp ./package.json ./bin/ubuntu24/package.json
        cp ./config.json.sample ./bin/ubuntu24/config.json
        cp ./ccx-guardian.service.template ./bin/ubuntu24/
        cp ./dist/sea.cjs ./bin/ubuntu24/index.js

        tar -czf ./output/guardian-linux64-ubuntu-24.tar.gz --exclude guardian-linux64-ubuntu-24.tar.gz -C ./bin/ubuntu24 .

    - name: Generate SHA-256 hash
      id: generate_hash
      run: |
        hash=$(sha256sum output/guardian-linux64-ubuntu-24.tar.gz | cut -d' ' -f1)
        echo "$hash" > output/guardian-linux64-ubuntu-24.tar.gz.sha256
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
        echo "SHA-256: $hash"

    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: guardian-linux64-ubuntu24
        path: output/guardian-linux64-ubuntu-24.tar.gz
        retention-days: 3

    - name: Create Release (Tag-based builds)
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2.0.4
      with:
        files: output/guardian-linux64-ubuntu-24.tar.gz
        draft: true
        name: Conceal Guardian ${{ github.ref_name }}
        body: |
          **Ubuntu 24.04 Build** - guardian-linux64-ubuntu-24.tar.gz
          `SHA256: ${{ steps.generate_hash.outputs.hash }}`
        append_body: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
