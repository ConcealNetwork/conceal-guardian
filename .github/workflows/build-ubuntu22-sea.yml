# Experimental: Node SEA packaging (stock Node 22 + postject).
# Dispatch-only — does not publish releases or replace the nexe workflow.
name: Build Ubuntu 22.04 Executable (SEA)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-ubuntu22-sea]

permissions:
  contents: read

jobs:
  build-ubuntu22-sea:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      # Blob and injected binary must be the same Node minor.
      NODE_SEA_VERSION: "22.23.2"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        ref: ${{ github.event.client_payload.branch || 'master' }}

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ env.NODE_SEA_VERSION }}

    - name: Install dependencies
      run: npm ci

    - name: Build SEA binary and package
      run: |
        set -euo pipefail

        rm -rf ./bin/ubuntu22-sea ./dist ./output ./sea-prep.blob ./sea-config.json
        mkdir -p ./bin/ubuntu22-sea ./dist ./output

        # Single CJS bundle (SEA-friendly; avoids ESM loader edge cases).
        npx esbuild index.js \
          --bundle \
          --platform=node \
          --format=cjs \
          --outfile=dist/sea.cjs

        printf '%s\n' "{
          \"main\": \"dist/sea.cjs\",
          \"output\": \"sea-prep.blob\",
          \"disableExperimentalSEAWarning\": true
        }" > sea-config.json

        node --experimental-sea-config sea-config.json

        # Inject into a copy of this job's Node binary (same ${NODE_SEA_VERSION}).
        cp "$(command -v node)" ./bin/ubuntu22-sea/guardian-linux64
        npx --yes postject@1.0.0-alpha.6 \
          ./bin/ubuntu22-sea/guardian-linux64 \
          NODE_SEA_BLOB \
          sea-prep.blob \
          --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

        chmod +x ./bin/ubuntu22-sea/guardian-linux64
        ./bin/ubuntu22-sea/guardian-linux64 --version

        # Same sidecar layout as the nexe tarball (html, config, etc.).
        cp -R ./html ./bin/ubuntu22-sea/html
        cp ./exclude.txt ./bin/ubuntu22-sea/exclude.txt
        cp ./package.json ./bin/ubuntu22-sea/package.json
        cp ./config.json.sample ./bin/ubuntu22-sea/config.json
        cp ./ccx-guardian.service.template ./bin/ubuntu22-sea/
        cp ./dist/sea.cjs ./bin/ubuntu22-sea/index.js

        tar -czf ./output/guardian-linux64-ubuntu-22-sea.tar.gz -C ./bin/ubuntu22-sea .

    - name: Generate SHA-256 hash
      id: generate_hash
      run: |
        hash=$(sha256sum output/guardian-linux64-ubuntu-22-sea.tar.gz | cut -d' ' -f1)
        echo "$hash" > output/guardian-linux64-ubuntu-22-sea.tar.gz.sha256
        echo "hash=$hash" >> "$GITHUB_OUTPUT"
        echo "SHA-256: $hash"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: guardian-linux64-ubuntu22-sea
        path: output/guardian-linux64-ubuntu-22-sea.tar.gz
        retention-days: 3
